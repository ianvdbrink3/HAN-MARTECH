];
var defaults={business:"",goal:"",problem:"",baseline:"",experience:"",resources:"",tasks:["Marketingrapportages","Contentcreatie","Campagneanalyse"],ratings:{},checks:{},issueChecks:{},issueNotes:{},tools:["Algemene AI-assistent","AI binnen bestaande software","Gespecialiseerde AI-tool"],toolScores:{},selectedTool:"",pilotTask:"",pilotDuration:"",pilotOwner:"",pilotSuccess:"",kpiName:"Tijd per taak (minuten)",kpiBefore:"",kpiAfter:"",kpiTarget:"",decision:"",phaseDone:{},notes:""};
var data;try{data=Object.assign({},defaults,JSON.parse(localStorage.getItem(key)||"{}"))}catch(e){data=Object.assign({},defaults)}
var current="home";
function save(){localStorage.setItem(key,JSON.stringify(data));}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function progress(){return issues.filter(function(a,i){return data.issueChecks[i]}).length}
function nav(){var navs=[["home","Overzicht"]].concat(phases.map(function(p,i){return ["p"+i,(i+1)+". "+p]}),[["issues","Aandachtspunten ("+(issues.length-progress())+")"]]);document.getElementById("nav").innerHTML=navs.map(function(a){return '<button data-nav="'+a[0]+'" class="'+(current===a[0]?"active":"")+'">'+a[1]+'</button>'}).join("");}
function head(t,s){document.getElementById("heading").textContent=t;document.getElementById("subheading").textContent=s;}
function home(){head("AI-GROEIKOMPAS","Van marketingvraagstuk naar meetbare AI-toepassing");var done=Object.keys(data.phaseDone).filter(function(k){return data.phaseDone[k]}).length;var p=progress();return '<section class="hero"><div class="eyebrow">PRAKTIJKGERICHT AI-IMPLEMENTATIEMODEL</div><h2>Begin bij het marketingprobleem. Niet bij de AI-tool.</h2><p>Doorloop vijf samenhangende fasen, leg keuzes en bewijs vast en evalueer de opbrengsten. Dit is een onderzoeksprototype: de wegingen, instrumenten en toepasbaarheid moeten nog met het werkveld worden gevalideerd.</p><div class="hero-actions"><button class="btn" data-nav="p0">Start met fase 1 →</button><button class="btn alt" data-nav="issues">Bekijk verbeterpunten</button></div></section><div class="grid">'+card("Voortgang fasen",'<div class="big">'+done+' / 5</div><p class="muted">Zelf als afgerond gemarkeerd</p><div class="progress"><span style="width:'+(done*20)+'%"></span></div>')+card("Aandachtspunten",'<div class="big">'+(issues.length-p)+'</div><p class="muted">Open acties voor het ontwikkelteam</p><div class="progress"><span style="width:'+(100*p/issues.length)+'%"></span></div>')+card("Onderzoeksstatus",'<div class="pill warning">CONCEPT · NIET GEVALIDEERD</div><p class="muted">Scores zijn hulpmiddelen voor discussie, geen automatische goedkeuring.</p>')+'</div>'+card("Jouw route door het model",'<p class="muted small">Open elke fase om het bijbehorende werkblad te doorlopen.</p><div class="phasegrid">'+phases.map(function(x,i){return '<button class="phase" data-nav="p'+i+'"><span class="num">'+(i+1)+'</span><strong>'+esc(x)+'</strong><small>'+(data.phaseDone[i]?"✓ Zelf afgevinkt":"Nog niet afgerond")+'</small></button>'}).join("")+'</div>')+card("Over dit prototype",'<div class="overview-note"><b>Belangrijk:</b> registratie is voorlopig alleen lokaal in jouw browser. Gebruik JSON-export/import om werk uit te wisselen. Gebruik geen persoonsgegevens of vertrouwelijke bedrijfsdata. Het tabblad Aandachtspunten is bedoeld voor de GHUB-projectgroep en geen onderdeel van het klantadvies.</div>')}function ready(i){if(i===0)return !!(data.problem.trim()&&data.goal.trim());if(i===1)return data.tasks.some(function(t){return priority.every(function(p){return rating(t,"priority:"+p[0])>=1})&&suitability.every(function(c){return rating(t,"fit:"+c)>=1})});if(i===2)return risks.every(function(r,j){return !!data.checks["risk"+j]});if(i===3)return !!(data.selectedTool.trim()&&data.pilotTask.trim()&&data.pilotSuccess.trim()&&data.checks.vendorPrivacy&&data.checks.vendorSecurity);if(i===4)return !!(data.kpiBefore!==""&&data.kpiAfter!==""&&data.decision);return false}
function finish(i){var r=ready(i);return '<label class="checkrow"><input type="checkbox" data-phase="'+i+'" '+(data.phaseDone[i]?"checked":"")+' '+(!r&&!data.phaseDone[i]?"disabled":"")+'><div><b>Fase als afgerond markeren</b><div class="muted small">'+(r?"Minimale invulvoorwaarden gehaald. Controleer de onderbouwing en bewijsstukken.":"Nog niet gereed: vul eerst de minimale gegevens en controles in.")+'</div></div></label>'}function phase0(){head("Fase 1 · Bedrijfsanalyse","Bepaal eerst het marketingvraagstuk, daarna pas de technologie");return card("Bedrijfsprofiel",'<div class="formgrid">'+field("Organisatie / casusnaam","business")+field("Huidige AI-ervaring","experience")+'</div>'+field("Marketingprobleem","problem","textarea")+field("Gewenste commerciële verbetering","goal","textarea")+field("Beschikbare tijd, kennis, systemen en budget","resources","textarea")+finish(0))+card("Output",'<p>Een heldere probleemdefinitie en een toetsbaar verbeterdoel. Onderbouw waarom deze prioriteit bij de marketingstrategie past.</p>')}
var suitability=["Duidelijkheid","Beschikbaarheid informatie","Controleerbaarheid","Herhaalbaarheid","Toegevoegde waarde","Beheersbaarheid fouten","Menselijke betrokkenheid"];

function phase2(){head("Fase 2 · Procesprioritering","Beoordeel geschiktheid en prioriteit van marketingtaken");var rows=data.tasks.map(function(t,j){var fits=suitability.map(function(c){return rating(t,"fit:"+c)});var scores=priority.map(function(p){return rating(t,"priority:"+p[0])});var s=fits.every(function(n){return n>=1&&n<=5})?(fits.reduce(function(a,n){return a+n},0)/7).toFixed(1):"—";var w=scores.every(function(n){return n>=1&&n<=5})?(priority.reduce(function(a,p){return a+rating(t,"priority:"+p[0])*p[1]},0)/5).toFixed(0):"—";return '<tr><td><b>'+esc(t)+'</b><div class="muted small">Geschiktheid: '+s+'/5</div></td>'+priority.map(function(p){return '<td><input aria-label="'+esc(p[0])+'" type="number" min="1" max="5" data-rate="'+esc(t+"|priority:"+p[0])+'" value="'+(rating(t,"priority:"+p[0])||"")+'"></td>'}).join("")+'<td><b>'+w+'/100</b></td><td><button class="btn alt" data-remove-task="'+j+'">×</button></td></tr>'}).join("");return '<div class="hint">Vul voor iedere taak alle criteria in. Lege criteria geven geen totaalscore. De voorlopige gewogen score wordt berekend als som(score 1–5 × gewicht) / 5. Score 1 betekent ongunstig, 5 gunstig. De weging en scoreankers zijn <b>nog niet gevalideerd</b>; een hoge score heft nooit juridische of veiligheidsblokkades op.</div>'+card("Prioriteitenmatrix",'<div class="tablewrap"><table><thead><tr><th>Marketingtaak</th>'+priority.map(function(p){return '<th>'+p[0]+'<br><span class="muted">'+p[1]+'%</span></th>'}).join("")+'<th>Score</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="toolbar" style="margin-top:15px"><input id="newTask" placeholder="Nieuwe marketingtaak" aria-label="Nieuwe marketingtaak"><button class="btn" id="addTask">Taak toevoegen</button></div>')+card("Geschiktheidsscan",'<p class="muted small">Controleer de geschiktheid apart. Dit prototype toont de scores maar bepaalt nog niet zelfstandig een geldige grens.</p><div class="tablewrap"><table><thead><tr><th>Criterium</th>'+data.tasks.map(function(t){return '<th>'+esc(t)+'</th>'}).join("")+'</tr></thead><tbody>'+suitability.map(function(c){return '<tr><td>'+esc(c)+'</td>'+data.tasks.map(function(t){return '<td><input type="number" min="1" max="5" data-rate="'+esc(t+"|fit:"+c)+'" value="'+(rating(t,"fit:"+c)||"")+'"></td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'+finish(1))}
var risks=["Gegevens beschikbaar en betrouwbaar","Doel en grondslag persoonsgegevens vastgesteld","Noodzaak DPIA beoordeeld","AI-verordening en marketingkanaal beoordeeld","Menselijk toezicht geregeld","Toegangsbeheer en beveiliging onderzocht","Verantwoordelijke aangewezen"];
function phase3(){head("Fase 3 · Randvoorwaarden","Beoordeel een use-case voordat je concrete leveranciers gaat testen");return '<div class="hint">Dit is een voorbereidende controle. Na toolkeuze in fase 4 is een <b>tweede leveranciersspecifieke check</b> noodzakelijk. Deze checklist levert geen juridische goedkeuring op.</div>'+card("Risico- en datacontrole",risks.map(function(r,i){return '<label class="checkrow"><input type="checkbox" data-check="risk'+i+'" '+(data.checks["risk"+i]?"checked":"")+'><span>'+esc(r)+'</span></label>'}).join("")+finish(2))+card("Go / no-go",'<p><b>Voorlopige status:</b> <span class="pill '+(risks.every(function(r,i){return data.checks["risk"+i]})?"ok":"warning")+'">'+(risks.every(function(r,i){return data.checks["risk"+i]})?"Checklist doorlopen – nog te valideren":"Aanvullende beoordeling nodig")+'</span></p><p class="muted small">Niet-afgevinkte onderdelen zijn onbekend of open. Dit is geen automatische vrijgave voor gebruik van persoonsgegevens.</p>')}
var toolCriteria=["Taakfit","Data","Integratie","Kosten","Outputkwaliteit","Gebruiksgemak","Meerwaarde","Leveranciersafhankelijkheid"];
function phase4(){head("Fase 4 · AI-selectie & pilot","Vergelijk oplossingen, controleer leverancier en test gecontroleerd");return card("Selectie van concrete AI-oplossingen",'<p class="muted small">Vervang de drie voorbeelden door specifieke tools en voer dezelfde testopdrachten uit.</p><div class="tablewrap"><table><thead><tr><th>Criterium</th>'+data.tools.map(function(t,i){return '<th><input type="text" data-toolname="'+i+'" value="'+esc(t)+'"></th>'}).join("")+'</tr></thead><tbody>'+toolCriteria.map(function(c){return '<tr><td>'+esc(c)+'</td>'+data.tools.map(function(t,i){var k=i+"|"+c;return '<td><input type="number" min="1" max="5" data-toolscore="'+esc(k)+'" value="'+(data.toolScores[k]===undefined?"":Number(data.toolScores[k]))+'"></td>'}).join("")+'</tr>'}).join("")+'</tbody><tfoot><tr><th>Gemiddeld</th>'+data.tools.map(function(t,i){return '<th>'+(toolCriteria.every(function(c){return Number(data.toolScores[i+"|"+c])>=1})?(toolCriteria.reduce(function(a,c){return a+Number(data.toolScores[i+"|"+c])},0)/toolCriteria.length).toFixed(1):"—")+'/5</th>'}).join("")+'</tr></tfoot></table></div>'+field("Geselecteerde toepassing en onderbouwing","selectedTool","textarea"))+card("Pilotplan",'<div class="formgrid">'+field("Afgebakende marketingtaak","pilotTask")+field("Verantwoordelijke","pilotOwner")+field("Testduur / herhaalde uitvoeringen","pilotDuration")+field("Succes- en stopcriteria","pilotSuccess")+'</div><div class="line"></div><h3>Verplichte leverancierscontrole na toolkeuze</h3><label class="checkrow"><input type="checkbox" data-check="vendorPrivacy" '+(data.checks.vendorPrivacy?"checked":"")+'><span>Gegevensverwerking, bewaartermijnen, eventuele doorgifte en contractafspraken van de gekozen leverancier beoordeeld</span></label><label class="checkrow"><input type="checkbox" data-check="vendorSecurity" '+(data.checks.vendorSecurity?"checked":"")+'><span>Beveiliging, toegangsrechten en menselijk toezicht gecontroleerd vóór de pilot</span></label><p class="muted small">Afvinken is alleen een registratie, geen juridische vrijgave.</p><p class="muted small">Voer vóór de pilot een nulmeting uit; bepaal daarna pas het effect. Voer een leveranciersspecifieke privacy- en beveiligingscheck uit voordat persoonsgegevens in tools worden gebruikt.</p>'+finish(3))}
function phase5(){head("Fase 5 · Meten & evalueren","Vergelijk de effectmeting met de vooraf vastgelegde nulmeting");var b=Number(data.kpiBefore),a=Number(data.kpiAfter),has=data.kpiBefore!==""&&data.kpiAfter!=="";var change=has&&b!==0?((a-b)/Math.abs(b)*100).toFixed(1):null;return card("Meetinstrument",'<div class="formgrid">'+field("KPI / meeteenheid","kpiName")+field("Doelwaarde en kwaliteitsnorm","kpiTarget")+field("Nulmeting vóór pilot","kpiBefore","number")+field("Effectmeting ná pilot","kpiAfter","number")+'</div><div class="pill">'+(change===null?"Vul metingen in voor een vergelijking":"Verandering: "+change+"%")+'</div><p class="muted small">De betekenis van een positieve of negatieve verandering hangt af van de KPI. Een lagere tijd per taak is gunstig; een lagere conversieratio vaak niet. Trek geen causale conclusies uit alleen een voor- en nameting.</p>')+card("Evaluatiebesluit",'<div class="field"><label>Vervolg</label><select data-key="decision"><option value="">Selecteer besluit</option>'+["Doorgaan","Bijsturen","Stoppen"].map(function(x){return '<option '+(data.decision===x?"selected":"")+'>'+x+'</option>'}).join("")+'</select></div>'+field("Onderbouwing, klantwaarde, kosten, risico's en vervolgacties","notes","textarea")+finish(4))}
function attention(){head("Aandachtspunten","Verbeterplan op basis van de kritische beoordeling van het AI-GROEIKOMPAS");var completed=progress();return card("Voortgang verbeterpunten",'<div class="grid"><div><div class="stat">'+issues.length+'</div><div class="muted">Totaal</div></div><div><div class="stat">'+completed+'</div><div class="muted">Afgevinkt</div></div><div><div class="stat">'+(issues.length-completed)+'</div><div class="muted">Nog open</div></div></div><div class="progress"><span style="width:'+(completed/issues.length*100)+'%"></span></div><p class="muted small">Afvinken registreert voortgang, maar bewijst nog niet dat een onderdeel onderzocht of gevalideerd is.</p>')+'<div class="toolbar" style="margin-bottom:16px"><button class="btn alt" data-filter="all">Alles</button><button class="btn alt" data-filter="open">Open</button><button class="btn alt" data-filter="high">Hoge prioriteit</button></div><div id="issueslist">'+issueCards("all")+'</div>'}
function issueCards(filter){return issues.map(function(x,i){var done=!!data.issueChecks[i];if(filter==="open"&&done||filter==="high"&&x[1]!=="Hoog")return "";return '<div class="card issue '+(x[1]==="Hoog"?"high":"")+' '+(done?"done":"")+'"><div class="issuehead"><div><div class="eyebrow">'+esc(x[2])+' · PRIORITEIT '+esc(x[1])+'</div><strong>'+(i+1)+'. '+esc(x[0])+'</strong></div><span class="pill '+(done?"ok":x[1]==="Hoog"?"warning":"")+'">'+(done?"Afgevinkt":"Open")+'</span></div><p>'+esc(x[3])+'</p><label class="checkrow"><input type="checkbox" data-issue="'+i+'" '+(done?"checked":"")+'><span>Verbeteractie uitgevoerd en gecontroleerd</span></label><textarea data-note="'+i+'" placeholder="Bewijs, beslissing, feedback of vervolgstap...">'+esc(data.issueNotes[i]||"")+'</textarea></div>'}).join("")}
function render(){nav();var h=current==="home"?home():current==="issues"?attention():current==="p0"?phase0():current==="p1"?phase2():current==="p2"?phase3():current==="p3"?phase4():phase5();document.getElementById("view").innerHTML=h;window.scrollTo(0,0)}
document.addEventListener("click",function(e){var el=e.target.closest("[data-nav]");if(el){current=el.dataset.nav;render();return}if(e.target.id==="addTask"){var v=document.getElementById("newTask").value.trim();if(v&&!data.tasks.includes(v)){data.tasks.push(v);save();render()}return}el=e.target.closest("[data-remove-task]");if(el){data.tasks.splice(Number(el.dataset.removeTask),1);save();render();return}el=e.target.closest("[data-filter]");if(el){document.getElementById("issueslist").innerHTML=issueCards(el.dataset.filter)}});
document.addEventListener("input",function(e){var el=e.target;if(el.dataset.key){data[el.dataset.key]=el.value;save()}if(el.dataset.note!==undefined){data.issueNotes[el.dataset.note]=el.value;save()}if(el.dataset.rate){var val=el.value===""?0:Math.min(5,Math.max(1,Number(el.value)||1));data.ratings[el.dataset.rate]=val;save()}if(el.dataset.toolscore){data.toolScores[el.dataset.toolscore]=el.value===""?0:Math.min(5,Math.max(1,Number(el.value)||1));save()}if(el.dataset.toolname!==undefined){data.tools[Number(el.dataset.toolname)]=el.value;save()}});
document.addEventListener("change",function(e){var el=e.target;if(el.dataset.issue!==undefined){data.issueChecks[el.dataset.issue]=el.checked;save();render()}else if(el.dataset.check){data.checks[el.dataset.check]=el.checked;save();render()}else if(el.dataset.phase!==undefined){if(el.checked&&!ready(Number(el.dataset.phase))){alert("Vul eerst de minimale voorwaarden in.");render();return}data.phaseDone[el.dataset.phase]=el.checked;save();render()}else if(el.dataset.key){data[el.dataset.key]=el.value;save()}else if(el.dataset.rate||el.dataset.toolscore){save();render()}});
document.getElementById("export").onclick=function(){var blob=new Blob([JSON.stringify({format:"HAN-AI-GROEIKOMPAS",version:1,data:data},null,2)],{type:"application/json"});var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="AI-Groeikompas-voortgang.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
document.getElementById("import").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result);if(obj.format!=="HAN-AI-GROEIKOMPAS"||!obj.data||typeof obj.data!=="object")throw Error("Onjuist bestand");data=Object.assign({},defaults,obj.data);save();render()}catch(err){alert("Import mislukt: "+err.message)}};reader.readAsText(file)};
render();
})();
</script></body></html>
