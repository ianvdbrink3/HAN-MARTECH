var issueDetails=[["De schaal 1–5 is niet uitgelegd. Daardoor kan een score subjectief zijn en kunnen twee gebruikers verschillende conclusies trekken.","Schrijf per criterium scoreankers voor 1, 3 en 5, test deze op dezelfde casus en werk daarna ook 2 en 4 uit.","Een scorehandleiding en aantoonbaar geteste voorbeeldbeoordelingen."],["De verdeling van de gewichten is een ontwerpvoorstel, geen wetenschappelijke norm. Daarmee kan één criterium de uitkomst te sterk beïnvloeden.","Vraag meerdere experts naar de relatieve belangrijkheid, vergelijk antwoorden en voer een gevoeligheidsanalyse uit.","Onderbouwde wegingen, expertfeedback en een vergelijking met alternatieve gewichten."],["Zonder formule en regels voor lege antwoorden is een score van bijvoorbeeld 80/100 niet navolgbaar.","Documenteer formule, afronding, schaalrichting en ontbrekende input; toets met een handmatig rekenvoorbeeld.","Geverifieerde formule en controleerbare testberekening."],["Je kent de gekozen leverancier nog niet in fase 3. Privacy-, opslag- en contractrisico's kunnen pas daarna concreet worden vastgesteld.","Behoud een algemene risicoanalyse in fase 3 en voer een tweede leverancierscontrole uit in fase 4.","Twee aantoonbare controlepunten met duidelijke go/no-go-vragen."],["Een nulmeting na de pilot is niet valide als die wordt gebruikt om achteraf succes vast te stellen.","Leg KPI's, nulwaarde en succescriteria vast voordat de pilot start; evalueer in fase 5.","Een vooraf gedateerd meetplan en achteraf vergelijkbare metingen."],["Een lijst met hulpmiddelen is niet hetzelfde als een werkend adviesinstrument. Zonder instructies moet de gebruiker zelf de methode ontwerpen.","Maak ieder hulpmiddel invulbaar met uitleg, invoervoorbeeld, beoordelingsregels, resultaat en vervolgstap.","Een complete gebruikersroute zonder aanvullende mondelinge uitleg."],["De hoeveelheid stappen en documenten kan voor een klein marketingteam te zwaar zijn.","Laat MKB-gebruikers de route uitvoeren en meet tijd, verwarring, benodigde hulp en bruikbaarheid.","Een praktijktest met tijdsregistratie en verwerkte gebruiksfeedback."],["Het samengestelde model is nog niet getest als één geheel. Een logisch verhaal is nog geen bewezen effectiviteit.","Test een representatieve casus, leg onderzoeksmethode en observaties vast en verwerk de uitkomsten aantoonbaar.","Een validatierapport met beperkingen en gedocumenteerde verbeteringen."],["Fase 2 en 4 bespreken deels dezelfde thema's, waardoor de gebruiker dubbel werk kan krijgen.","Fase 2 kiest de taak; fase 4 vergelijkt concrete oplossingen. Hergebruik bekende antwoorden.","Twee verschillende, helder begrensde beslisproducten."],["Alleen functieomschrijvingen en leveranciersinformatie bewijzen niet welke oplossing geschikt is.","Laat twee of drie oplossingen dezelfde taken uitvoeren; meet kwaliteit, correctietijd en gebruiksgemak.","Een toetsbare vergelijking met concrete testresultaten."],["De literatuur over acceptatie is niet vertaald naar een eenvoudige medewerkersscan.","Maak vragen over nut, vaardigheid, vertrouwen, ondersteuning en controle; test begrijpelijkheid.","Een korte getoetste scan met passende trainingsacties."],["Zonder vooraf vastgestelde succes- en stopcriteria kan de pilot eindeloos doorgaan of achteraf positief worden uitgelegd.","Bepaal vooraf duur, taakfrequentie, verantwoordelijke, kwaliteitsnorm en stopmoment.","Een volledig pilotplan dat vóór de start is bevestigd."],["De KPI's missen soms eenheid, bron en berekening. Tijdwinst is bovendien niet hetzelfde als geld besparen.","Leg per KPI nulwaarde, eindwaarde, bron, formule en kwaliteitscriterium vast; scheid capaciteit van financiële besparing.","Controleerbaar KPI-formulier en financiële rekenvoorbeelden."],["Een geslaagde pilot kan alsnog mislukken bij overdracht of veranderende software.","Leg eigenaarschap, instructies, controles, evaluatiemoment en training vast.","Overdrachtsplan met verantwoordelijkheden en controlemomenten."],["De gebruikte theorieën function home(){head("AI-GROEIKOMPAS","Van marketingvraagstuk naar meetbare AI-toepassing");var done=Object.keys(data.phaseDone).filter(function(k){return data.phaseDone[k]}).length;var p=progress();return '<section class="hero"><div class="eyebrow">PRAKTIJKGERICHT AI-IMPLEMENTATIEMODEL</div><h2>Begin bij het marketingprobleem. Niet bij de AI-tool.</h2><p>Doorloop vijf samenhangende fasen, leg keuzes en bewijs vast en evalueer de opbrengsten. Dit is een onderzoeksprototype: de wegingen, instrumenten en toepasbaarheid moeten nog met het werkveld worden gevalideerd.</p><div class="hero-actions"><button class="btn" data-nav="p0">Start met fase 1 →</button><button class="btn alt" data-nav="issues">Bekijk verbeterpunten</button></div></section><div class="grid">'+card("Voortgang fasen",'<div class="big">'+done+' / 5</div><p class="muted">Zelf als afgerond gemarkeerd</p><div class="progress"><span style="width:'+(done*20)+'%"></span></div>')+card("Aandachtspunten",'<div class="big">'+(issues.length-p)+'</div><p class="muted">Open acties voor het ontwikkelteam</p><div class="progress"><span style="width:'+(100*p/issues.length)+'%"></span></div>')+card("Onderzoeksstatus",'<div class="pill warning">CONCEPT · NIET GEVALIDEERD</div><p class="muted">Scores zijn hulpmiddelen voor discussie, geen automatische goedkeuring.</p>')+'</div>'+card("Jouw route door het model",'<p class="muted small">Open elke fase om het bijbehorende werkblad te doorlopen.</p><div class="phasegrid">'+phases.map(function(x,i){return '<button class="phase" data-nav="p'+i+'"><span class="num">'+(i+1)+'</span><strong>'+esc(x)+'</strong><small>'+(data.phaseDone[i]?"✓ Zelf afgevinkt":"Nog niet afgerond")+'</small></button>'}).join("")+'</div>')+card("Over dit prototype",'<div class="overview-note"><b>Belangrijk:</b> registratie is voorlopig alleen lokaal in jouw browser. Gebruik JSON-export/import om werk uit te wisselen. Gebruik geen persoonsgegevens of vertrouwelijke bedrijfsdata. Het tabblad Aandachtspunten is bedoeld voor de GHUB-projectgroep en geen onderdeel van het klantadvies.</div>')}

function ready(i){if(i===0)return !!(data.problem.trim()&&data.goal.trim());if(i===1)return data.tasks.some(function(t){return priority.every(function(p){return rating(t,"priority:"+p[0])>=1})&&suitability.every(function(c){return rating(t,"fit:"+c)>=1})});if(i===2)return risks.every(function(r,j){return !!data.checks["risk"+j]});if(i===3)return !!(data.selectedTool.trim()&&data.pilotTask.trim()&&data.pilotSuccess.trim()&&data.checks.vendorPrivacy&&data.checks.vendorSecurity);if(i===4)return !!(data.kpiBefore!==""&&data.kpiAfter!==""&&data.decision);return false}

function phase3(){head("Fase 3 · Randvoorwaarden & risico's","Controleer of de voorgenomen toepassing veilig voorbereid kan worden");return intro(3,"Wat moet geregeld zijn vóór je AI gaat testen?","Je onderzoekt eerst de algemene risico’s van de marketingtaak. Controleer privacy, gegevenskwaliteit, wettelijke eisen en menselijk toezicht. Pas na het kiezen van een specifieke tool controleer je ook de leverancier.","Als de tool klantdata zou verwerken, moet duidelijk zijn waarom die gegevens nodig zijn, wie toegang heeft en welke afspraken gelden.","Een overzicht van open risico's en een verantwoord besluit over de volgende stap.")+guideCard("1. Loop de randvoorwaarden langs",'<p class="guide-lead">Vink alleen af als het onderdeel <b>daadwerkelijk gecontroleerd</b> is. Niet afgevinkt betekent: onbekend of nog niet geregeld.</p>'+risks.map(function(r,i){return '<label class="checkrow checklist-rich"><input type="checkbox" data-check="risk'+i+'" '+(data.checks["risk"+i]?"checked":"")+'><span><b>'+esc(r)+'</b><small>'+(["Welke gegevens zijn nodig en hoe controleer je de kwaliteit?","Waarom mag je deze gegevens gebruiken?","Is een privacy-effectbeoordeling nodig?","Welke regels gelden voor deze specifieke marketingtaak?","Wie beoordeelt de AI-uitkomst en grijpt in bij fouten?","Hoe wordt ongewenste toegang voorkomen?","Wie is verantwoordelijk voor de uiteindelijke keuze?"][i])+'</small></span></label>'}).join(""))+guideCard("2. Interpreteer de uitkomst",'<div class="decision-box"><b>'+(risks.every(function(r,i){return data.checks["risk"+i]})?"Alle voorbereidende onderdelen afgevinkt":"Nog niet alle randvoorwaarden beoordeeld")+'</b><p>'+(risks.every(function(r,i){return data.checks["risk"+i]})?"Ga pas naar een echte pilot nadat ook de gekozen leverancier specifiek is beoordeeld.":"Werk open controles eerst uit. Onzekerheid over privacy, beveiliging of regelgeving vraagt aanvullende beoordeling.")+'</p></div><p class="form-note">Dit formulier is een hulpmiddel voor risico- function phase5(){head("Fase 5 · Meten, evalueren & verbeteren","Laat zien wat de AI-toepassing daadwerkelijk oplevert");var b=Number(data.kpiBefore),a=Number(data.kpiAfter),has=data.kpiBefore!==""&&data.kpiAfter!=="";var change=has&&b!==0?((a-b)/Math.abs(b)*100).toFixed(1):null;return intro(5,"Heeft de pilot het oorspronkelijke marketingprobleem opgelost?","Vergelijk dezelfde taak vóór en ná de invoering. Kijk niet alleen naar snelheid, maar ook naar kwaliteit, kosten, medewerkerervaring en — als relevant — klantwaarde.","Zonder AI duurde een rapportage 90 minuten; met AI inclusief controle 50 minuten. Controleer of de foutmarge gelijk is gebleven.","Een onderbouwde keuze: doorgaan, bijsturen of stoppen.")+guideCard("1. Leg de meting vast",helpField("Welke KPI meet je?","kpiName","Kies een meeteenheid die past bij het oorspronkelijke probleem. Gebruik aanvullende kwaliteitscriteria waar nodig.","Tijd per gecontroleerde rapportage (minuten)","text")+helpField("Wat was vooraf het doel en welke kwaliteitseis gold?","kpiTarget","Het doel moet vóór de pilot zijn vastgelegd; voorkom dat je achteraf de lat verschuift.","Maximaal 45 minuten, zonder kritieke fouten.","text")+'<div class="measurement-grid">'+helpField("Nulmeting: vóór AI","kpiBefore","Meet de oude werkwijze inclusief controle en nabewerking.","90","number")+helpField("Effectmeting: mét AI","kpiAfter","Gebruik vergelijkbare taken en tel controles en correcties mee.","50","number")+'</div><div class="decision-box"><b>'+(change===null?"Nog geen vergelijkbare meting":"Gemeten verandering: "+change+"%")+'</b><p>Een lagere waarde is alleen gunstig bij indicatoren zoals tijd of kosten. Een eenvoudige voor- en nameting bewijst niet dat AI de enige oorzaak is.</p></div>')+guideCard("2. Neem een besluit met uitleg",'<div class="field"><label>Wat is de vervolgbeslissing?</label><select data-key="decision"><option value="">Maak een keuze</option>'+["Doorgaan","Bijsturen","Stoppen"].map(function(x){return '<option '+(dat function attention(){head("Aandachtspunten","Verbeterplan op basis van de kritische beoordeling van het AI-GROEIKOMPAS");var completed=progress();return card("Voortgang verbeterpunten",'<div class="grid"><div><div class="stat">'+issues.length+'</div><div class="muted">Totaal</div></div><div><div class="stat">'+completed+'</div><div class="muted">Afgevinkt</div></div><div><div class="stat">'+(issues.length-completed)+'</div><div class="muted">Nog open</div></div></div><div class="progress"><span style="width:'+(completed/issues.length*100)+'%"></span></div><p class="muted small">Afvinken registreert voortgang, maar bewijst nog niet dat een onderdeel onderzocht of gevalideerd is.</p>')+'<div class="toolbar" style="margin-bottom:16px"><button class="btn alt" data-filter="all">Alles</button><button class="btn alt" data-filter="open">Open</button><button class="btn alt" data-filter="high">Hoge prioriteit</button></div><div id="issueslist">'+issueCards("all")+'</div>'}
function issueCards(filter){return issues.map(function(x,i){var done=!!data.issueChecks[i],d=issueDetails[i];if(filter==="open"&&done||filter==="high"&&x[1]!=="Hoog")return "";return '<article class="card issue '+(x[1]==="Hoog"?"high":"")+' '+(done?"done":"")+'"><div class="issuehead"><div><div class="eyebrow">'+esc(x[2])+' · PRIORITEIT '+esc(x[1])+'</div><h3>'+(i+1)+'. '+esc(x[0])+'</h3></div><span class="pill '+(done?"ok":x[1]==="Hoog"?"warning":"")+'">'+(done?"Afgevinkt":"Open")+'</span></div><div class="issue-section"><b>Wat gaat er mis?</b><p>'+esc(d[0])+'</p></div><div class="issue-section"><b>Waarom is dit belangrijk?</b><p>'+esc(x[3])+'</p></div><div class="issue-section"><b>Hoe lossen we dit concreet op?</b><p>'+esc(d[1])+'</p></div><div class="evidence-box"><b>Wanneer mag je dit afvinken?</b><p>'+esc(d[2])+'</p></div><label class="checkrow"><input type="checkbox" data-issue="'+i+'" '+(done?"checked":"")+'><span><b>Actie opgelost en onderbouwing gecontroleerd</b><small>Vink pas af wanneer het resultaat beschikbaar is.</small></span></label><div class="field"><label>Feedback, bewijs en vervolgacties</label><textarea data-note="'+i+'" placeholder="Wat is veranderd en waar staat het bewijs?">'+esc(data.issueNotes[i]||"")+'</textarea></div></article>'}).join("")}

document.addEventListener("click",function(e){var el=e.target.closest("[data-nav]");if(el){current=el.dataset.nav;render();return}if(e.target.id==="addTask"){var v=document.getElementById("newTask").value.trim();if(v&&!data.tasks.includes(v)){data.tasks.push(v);save();render()}return}el=e.target.closest("[data-remove-task]");if(el){data.tasks.splice(Number(el.dataset.removeTask),1);save();render();return}el=e.target.closest("[data-filter]");if(el){document.getElementById("issueslist").innerHTML=issueCards(el.dataset.filter)}});
